<!doctype html>
<html>
  <head>
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
  <div class="container">
    <h1>Thank you, {{name}} for your order!</h1>
    <p>Your order has been placed.</p>
    <h3>Order Summary:</h3>
    <p>Item: {{ meal }}</p>
    
    {% if instructions %}
      <p><strong>Special Instructions:</strong> {{ instructions }}</p>
    {% endif %}

    <h2>Total Cost: ${{ "%.2f"|format(total) }}</h2>
    
    <hr>
    <a href="/">Place another order</a> | <a href="/kitchen">Go to Kitchen Dashboard</a>
  </div>
  </body>
</html>
