<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #e3e8e8;
      display: flex;
      font-family: Arial, sans-serif;
    }

    .container1 {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 95%;
      height: 90%;
      margin: auto;
    }

    .container {
      display: flex;
      gap: 10px;
      width: 100%;
      height: 100%;
      margin: auto;
    }

    .editing-box, .result-box {
      flex: 1;
      background: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .editing-box h2 {
      color: #04AA6D;
      margin-top: 0;
    }

    .Run {
      background-color: #04AA6D;
      color: white;
      width: 10%;
      height: 5%;
    }

  </style>
</head>
<body>
  <div class="container1">
    <button class="Run">Run</button>
    <div class="container">
      <div class="editing-box">
        <p>Enter html code here</p>
      </div>

      <div class="result-box">
        <p>Preview of code will appear here</p>
      </div>
    </div>
    <a href="nextpage.html">Open Next Page</a>
  </div>

</body>
</html>
