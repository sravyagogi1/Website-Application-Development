<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Flask App</title>

    <!-- url_for builds the correct path to files in /static -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header>
      <h1>Hello, {{ name }}!</h1>
      <!-- {{ name }} is Jinja syntax — Flask replaces it with the value from app.py -->
      <p>Your Flask server is running. 🎉</p>
    </header>

    <main>
      <p>If you can read this, your setup works!</p>
      <a href="/about">Go to About page →</a>
      <p></p>
      <a href="/test">Go to Test page →</a>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
